    </text>

    <rect x="80" y="486" width="1040" height="1" fill="#e0ded8"/>

    <text x="80" y="536" font-size="27" fill="#55606f">
      AI-native products, built on Microsoft Azure
    </text>

    <g transform="translate(950,505)" font-family="ui-monospace,Menlo,Consolas,monospace">
