<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#faf9f7"/>
  <g font-family="ui-sans-serif,Segoe UI,Helvetica,Arial,sans-serif">
    <g transform="translate(80,72)">
      <rect width="40" height="40" rx="5" fill="#10192a"/>
      <text x="20" y="27" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace"
            font-size="17" font-weight="700" fill="#ffffff">10</text>
      <text x="56" y="28" font-size="25" font-weight="600" fill="#10192a" letter-spacing="-0.4">TenTo100</text>
    </g>

    <rect x="80" y="160" width="1040" height="1" fill="#e0ded8"/>

    <text x="80" y="200" font-family="ui-monospace,Menlo,Consolas,monospace"
